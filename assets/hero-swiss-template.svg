<svg viewBox="0 0 880 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{ARIA_LABEL}}">
  <!-- Swiss Grid hero template. Self-hosted: commit to the repo (e.g. assets/hero.svg) and
       reference with a relative path. Fill every {{PLACEHOLDER}}; sizes assume <=18 chars
       of wordmark at 56-64px, shrink font-size for longer names. System font stacks only:
       SVG-in-img cannot load external fonts. Keep text readable at t=0 (animation is
       progressive enhancement, never a reveal). -->
  <style>
    .hero-bg { fill: #f7f6f2; }
    .hero-grid { stroke: #e4e2da; stroke-width: 1; }
    .hero-rule { stroke: #16150f; stroke-width: 1.5; }
    .hero-wordlight { font: 200 {{FONT_SIZE|56}}px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #16150f; letter-spacing: -1px; }
    .hero-wordheavy { font: 800 {{FONT_SIZE|56}}px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #16150f; letter-spacing: -2px; }
    .hero-micro { font: 500 11px ui-monospace, 'SF Mono', Menlo, monospace; fill: #16150f; letter-spacing: 2.5px; }
    .hero-microdim { font: 500 11px ui-monospace, 'SF Mono', Menlo, monospace; fill: #98948a; letter-spacing: 2.5px; }
    .hero-dot { fill: {{ACCENT|#e8442e}}; }
    .hero-station { animation: hero-hop 12s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes hero-hop {
      0%, 26%   { transform: translateX(0px); }
      33%, 59%  { transform: translateX(296px); }
      66%, 93%  { transform: translateX(592px); }
      100%      { transform: translateX(0px); }
    }
    .hero-drawline { stroke-dasharray: 752; stroke-dashoffset: 752; animation: hero-draw 2.2s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes hero-draw { to { stroke-dashoffset: 0; } }
  </style>

  <rect class="hero-bg" width="880" height="220"/>

  <line class="hero-grid" x1="64" y1="0" x2="64" y2="220"/>
  <line class="hero-grid" x1="294" y1="0" x2="294" y2="220"/>
  <line class="hero-grid" x1="524" y1="0" x2="524" y2="220"/>
  <line class="hero-grid" x1="754" y1="0" x2="754" y2="220"/>
  <line class="hero-grid" x1="0" y1="40" x2="880" y2="40"/>

  <text class="hero-microdim" x="64" y="30">{{TOP_LEFT_LABEL}}</text>
  <text class="hero-microdim" x="754" y="30">{{TOP_RIGHT_LABEL}}</text>

  <!-- extreme weight contrast: light prefix + heavy remainder -->
  <text x="62" y="122"><tspan class="hero-wordlight">{{NAME_LIGHT}}</tspan><tspan class="hero-wordheavy">{{NAME_HEAVY}}</tspan></text>

  <line class="hero-rule hero-drawline" x1="64" y1="156" x2="816" y2="156"/>

  <!-- accent square hops between the three stations -->
  <g class="hero-station">
    <rect class="hero-dot" x="59" y="151" width="10" height="10"/>
  </g>

  <!-- stations: use REAL facts (commands, pipeline stages) from the ledger -->
  <text class="hero-micro" x="64" y="186">{{STATION_1}}</text>
  <text class="hero-micro" x="360" y="186">{{STATION_2}}</text>
  <text class="hero-micro" x="656" y="186">{{STATION_3}}</text>
  <text class="hero-microdim" x="64" y="206">{{FOOTNOTE_TAGLINE}}</text>
</svg>
