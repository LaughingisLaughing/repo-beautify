<!-- repo-beautify hero template (brutalist style).
     Fill every {{PLACEHOLDER}}; {{KEY|default}} means replace with a value or keep the default.
     Rules (see references/visual-services.md, Self-hosted hero SVG):
     self-contained, system font stacks only, text readable at t=0, facts from the ledger,
     wordmark sized for <=18 chars (shrink font-size for longer names), adjust x/cx offsets
     to your text width after substitution. -->
<svg viewBox="0 0 880 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{ARIA_LABEL}}">
  <defs>
    <clipPath id="bru-tick"><rect x="6" y="166" width="868" height="48"/></clipPath>
  </defs>
  <style>
    .bru-word { font: 900 74px system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: -3px; }
    .bru-mono { font: 700 12px ui-monospace, 'SF Mono', Menlo, monospace; fill: #000; letter-spacing: 2.5px; }
    .bru-ticker { font: 700 22px ui-monospace, 'SF Mono', Menlo, monospace; fill: #fff; letter-spacing: 1px; }
    .bru-scroll { animation: bru-scroll 14s linear infinite; }
    @keyframes bru-scroll { to { transform: translateX(-934px); } }
  </style>

  <rect width="880" height="220" fill="#ffffff"/>
  <rect x="6" y="6" width="868" height="208" fill="none" stroke="#000" stroke-width="8"/>

  <text class="bru-mono" x="40" y="52">{{TOP_LEFT}}</text>
  <text class="bru-mono" x="700" y="52">{{TOP_RIGHT}}</text>

  <!-- hard-shadow stacked wordmark -->
  <text class="bru-word" x="46" y="136" fill="#ffd400">{{NAME_UPPER}}</text>
  <text class="bru-word" x="38" y="128" fill="#000000">{{NAME_UPPER}}</text>

  <!-- ticker strip: two copies for a seamless loop -->
  <rect x="6" y="166" width="868" height="48" fill="#000"/>
  <g clip-path="url(#bru-tick)">
    <g class="bru-scroll">
      <text class="bru-ticker" x="20" y="198">{{TICKER_TEXT}}</text>
      <text class="bru-ticker" x="954" y="198">{{TICKER_TEXT}}</text>
    </g>
  </g>
</svg>
