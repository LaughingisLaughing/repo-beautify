    .dw-mono { font: 400 12px ui-monospace, 'SF Mono', Menlo, monospace; fill: #767e93; letter-spacing: 2.5px; }
    .dw-dot { fill: #3a4356; animation: dw-pulse 3.6s ease-in-out infinite; }
